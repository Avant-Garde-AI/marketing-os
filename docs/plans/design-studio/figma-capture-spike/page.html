<!doctype html><html><head><style>
:root{--ink:#1d1b18;--gold:#b08d57;--paper:#f6f1e8}
body{margin:0;font-family:"DejaVu Serif",serif;background:var(--paper);color:var(--ink)}
.hero{display:flex;gap:48px;padding:64px;align-items:center}
.copy{display:flex;flex-direction:column;gap:16px;flex:1}
.eyebrow{letter-spacing:.2em;text-transform:uppercase;font:12px/1 "DejaVu Sans";color:var(--gold)}
h1{font-size:56px;margin:0;line-height:1.05}
.btn{align-self:flex-start;background:var(--ink);color:var(--paper);padding:14px 28px;border-radius:2px;font:14px "DejaVu Sans"}
.art{width:420px;height:420px;background:linear-gradient(135deg,#c9b38c,#6b5a3e)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 64px 64px}
.card{background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .img{height:180px;background:#ddd}
</style></head><body>
<div id="shopify-section-hero" class="hero"><div class="copy"><div class="eyebrow">New collection</div><h1>Quiet rooms, loud walls</h1><p>Museum-grade framed prints, hung by hand.</p><a class="btn" data-mos-id="hero-cta">Shop the edit</a></div><div class="art" data-mos-id="hero-art"></div></div>
<div id="shopify-section-grid" class="grid">
<div class="card"><div class="img"></div><b>Oak frame</b><span>$240</span></div>
<div class="card"><div class="img"></div><b>Walnut frame</b><span>$260</span></div>
<div class="card"><div class="img"></div><b>Gallery black</b><span>$220</span></div></div>
</body></html>
