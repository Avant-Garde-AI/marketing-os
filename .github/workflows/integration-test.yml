name: Integration Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22, not 20: @avant-garde/design-surfaces runs vitest under the
          # vmThreads pool (the only pool the Penpot zip writer survives), and
          # vmThreads SIGSEGVs on Node 20 — the whole suite exited 139 before a
          # single test ran. Reproducible locally: passes on 22, crashes on 20.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm turbo build --filter=@avant-garde/marketing-os

      - name: Run integration tests
        run: pnpm --filter @avant-garde/marketing-os test:integration
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/marketing-os/test-results/
