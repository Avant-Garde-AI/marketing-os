name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22, not 20: @avant-garde/design-surfaces runs vitest under the
          # vmThreads pool (the only pool the Penpot zip writer survives), and
          # vmThreads SIGSEGVs on Node 20 — the whole suite exited 139 before a
          # single test ran. Reproducible locally: passes on 22, crashes on 20.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm turbo lint

      - name: Run type-check
        run: pnpm turbo typecheck

      - name: Run tests
        run: pnpm turbo test

      - name: Build packages
        run: pnpm turbo build
